[package]
name = "coeirocore-rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "coeirocore_rs"
crate-type = ["cdylib"]

[dependencies]
glob = "0.3.4"
numpy = "0.29.0"
pyo3 = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
yaml-rust2 = "0.11.0"
